- name: Start Cloudflare Tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "ERROR:"
            echo "CLOUDFLARE_TUNNEL_TOKEN is not configured."
            exit 1
          fi

          nohup cloudflared tunnel \
            --no-autoupdate \
            run \
            --token "$CLOUDFLARE_TUNNEL_TOKEN" \
            > "$HOME/cloudflared.log" 2>&1 &

          CLOUDFLARE_PID=$!

          echo "$CLOUDFLARE_PID" \
            > "$HOME/cloudflared.pid"

          sleep 10

          echo
          echo "Cloudflare process:"
          ps -fp "$CLOUDFLARE_PID" || true

          echo
          echo "Cloudflare log:"
          tail -n 50 "$HOME/cloudflared.log" || true

      # ==================================================
      # 8. Final connectivity check
      # ==================================================
      - name: Check RDP environment
        run: |
          echo
          echo "=========================================="
          echo "XRDP"
          echo "=========================================="

          sudo systemctl is-active xrdp || true

          echo
          echo "=========================================="
          echo "PORT 3389"
          echo "=========================================="

          sudo ss -lntp | grep ':3389' || true

          echo
          echo "=========================================="
          echo "CLOUDFLARED"
          echo "=========================================="

          pgrep -a cloudflared || true

          echo
          echo "=========================================="
          echo "CLOUDFLARE LOG"
          echo "=========================================="

          tail -n 30 "$HOME/cloudflared.log" || true

      # ==================================================
      # 9. Display connection information
      # ==================================================
      - name: Display RDP information
        run: |
          echo
          echo "################################################"
          echo "#                                              #"
          echo "#           LINUX RDP IS READY                #"
          echo "#                                              #"
          echo "################################################"
          echo
          echo "Username:"
          echo "$RDP_USER"
          echo
          echo "Password:"
          echo "$RDP_PASSWORD"
          echo
          echo "Cloudflare hostname:"
          echo "rdp.example.com"
          echo
          echo "Local RDP service:"
          echo "127.0.0.1:3389"
          echo
          echo "################################################"
          echo "# Keep this workflow running while connected. #"
          echo "################################################"
          echo

      # ==================================================
      # 10. Keep machine alive
      # ==================================================
      - name: Keep desktop alive
        shell: bash
        run: |
          HOURS="${{ inputs.hours }}"
          REMAINING=$((HOURS * 3600))

          echo "Desktop lifetime: $HOURS hour(s)"

          while [ "$REMAINING" -gt 0 ]; do

            sleep 60

            REMAINING=$((REMAINING - 60))

            if [ $((REMAINING % 600)) -eq 0 ]; then
              echo "Approximately $((REMAINING / 60)) minutes remaining."
            fi

          done

          echo "Desktop lifetime expired."

      # ==================================================
      # 11. Cleanup
      # ==================================================
      - name: Stop Cloudflare Tunnel
        if: always()
        run: |
          if [ -f "$HOME/cloudflared.pid" ]; then
            PID="$(cat "$HOME/cloudflared.pid")"
            kill "$PID" 2>/dev/null || true
          fi

          sudo systemctl stop xrdp 2>/dev/null || true
