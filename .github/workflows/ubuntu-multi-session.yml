name: Ubuntu Desktop & SSH (Multi-Session)

on:
  workflow_dispatch:

jobs:
  multi-session:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Maximum allowed by GitHub (6 hours)

    steps:
      - name: Free Maximum Disk Space (~45GB)
        run: |
          echo "Clearing unused packages..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          echo "Disk space freed:"
          df -h /

      - name: Install Desktop, VNC, and SSH Tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-terminal \
            tigervnc-standalone-server \
            tigervnc-tools \
            tigervnc-common \
            novnc \
            websockify \
            curl \
            wget \
            openssl \
            tmate

      - name: Install Cloudflared Tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          rm -f cloudflared-linux-amd64.deb

      - name: Setup Multi-User VNC Desktop & Auto Password
        id: setup_desktop
        run: |
          # 1. Generate random 10-character alphanumeric password
          AUTO_PASS=$(openssl rand -base64 12 | tr -dc 'a-zA-Z0-9' | head -c 10)

          # 2. Sync password with 'runner' system account (for system / sudo auth)
          echo "runner:$AUTO_PASS" | sudo chpasswd

          # 3. Configure VNC password
          mkdir -p ~/.vnc
          echo "$AUTO_PASS" | vncpasswd -f > ~/.vnc/passwd 2>/dev/null || printf "$AUTO_PASS\n$AUTO_PASS\nn\n" | vncpasswd
          chmod 600 ~/.vnc/passwd

          # 4. Create XFCE session startup script
          cat << 'EOF' > ~/.vnc/xstartup
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec startxfce4
          EOF
          chmod +x ~/.vnc/xstartup

          # 5. Start TigerVNC with multi-client sharing enabled (-shared -NeverShared=0)
          VNC_CMD=$(command -v vncserver || command -v tigervncserver)
          $VNC_CMD :1 -geometry 1366x768 -depth 24 -shared -NeverShared=0

          # 6. Start HTML5 websockify bridge with keepalive heartbeat
          websockify --web /usr/share/novnc --heartbeat 30 6080 localhost:5901 &

          # Export password to subsequent workflow steps
          echo "PASS=$AUTO_PASS" >> "$GITHUB_OUTPUT"

      - name: Start Cloudflare Tunnel (Web GUI)
        id: tunnel
        run: |
          cloudflared tunnel --url http://localhost:6080 --logfile cloudflared.log &

          echo "Waiting for Cloudflare Tunnel to initialize..."
          TUNNEL_URL=""

          # Poll for up to 40 seconds to obtain tunnel URL
          for i in {1..40}; do
            if [ -f cloudflared.log ]; then
              TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' cloudflared.log | head -n 1)
              if [ -n "$TUNNEL_URL" ]; then
                echo "Tunnel ready after ${i} seconds."
                break
              fi
            fi
            sleep 1
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "ERROR: Cloudflare tunnel timed out. Log output:"
            cat cloudflared.log
            exit 1
          fi

          echo "URL=$TUNNEL_URL" >> "$GITHUB_OUTPUT"

      - name: Start SSH Terminal (tmate Multi-User)
        id: tmate_setup
        run: |
          # Start tmate socket in background with mouse support
          tmate -S /tmp/tmate.sock new-session -d -s main
          tmate -S /tmp/tmate.sock set-option -g mouse on
          tmate -S /tmp/tmate.sock wait tmate-ready

          SSH_CMD=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          WEB_SHELL=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}')

          echo "SSH=$SSH_CMD" >> "$GITHUB_OUTPUT"
          echo "WEB_SHELL=$WEB_SHELL" >> "$GITHUB_OUTPUT"

      - name: Publish Connection Summary
        run: |
          AUTO_PASS="${{ steps.setup_desktop.outputs.PASS }}"
          TUNNEL_URL="${{ steps.tunnel.outputs.URL }}"
          AUTOLOGIN_LINK="${TUNNEL_URL}/vnc.html?autoconnect=true&password=${AUTO_PASS}"
          SSH_CMD="${{ steps.tmate_setup.outputs.SSH }}"
          WEB_SHELL="${{ steps.tmate_setup.outputs.WEB_SHELL }}"

          # Print to console log
          echo "================================================================================"
          echo "  ONE-CLICK DESKTOP: $AUTOLOGIN_LINK"
          echo "  MANUAL WEB URL:   $TUNNEL_URL/vnc.html"
          echo "  PASSWORD:         $AUTO_PASS"
          echo "  SSH COMMAND:      $SSH_CMD"
          echo "  WEB TERMINAL:     $WEB_SHELL"
          echo "================================================================================"

          # Render in GitHub Actions Workflow Summary UI
          echo "## 🚀 Remote Ubuntu Runner Online" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🖥️ Web GUI Desktop (Multi-Client Enabled)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔗 **1-Click Auto-Login**: [Open Web Desktop](${AUTOLOGIN_LINK})" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 **Manual Link**: \`${TUNNEL_URL}/vnc.html\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🔑 **Password**: \`${AUTO_PASS}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💻 Full Root SSH Access" >> $GITHUB_STEP_SUMMARY
          echo "- ⚡ **SSH Command**: \`$SSH_CMD\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 **Browser Shell**: [Open Web Terminal](${WEB_SHELL})" >> $GITHUB_STEP_SUMMARY
          echo "- 🛡️ **Sudo**: Run \`sudo -i\` (no password required)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Session will stay active up to 6 hours.*" >> $GITHUB_STEP_SUMMARY

      - name: Keep-Alive Loop
        run: |
          echo "Runner active. Listening for connections..."
          for i in {1..350}; do
            echo "Heartbeat: minute $i of 350 active..."
            sleep 60
          done
