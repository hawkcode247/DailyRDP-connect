name: Ubuntu Desktop & SSH (Multi-Session)

on:
  workflow_dispatch:

jobs:
  multi-session:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub runner hard maximum: 6 hours

    steps:
      - name: Free Maximum Disk Space (~45GB)
        run: |
          echo "Clearing unused toolchains to reclaim disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          echo "Available storage:"
          df -h /

      - name: Install Desktop, VNC, DBus, OpenSSH and Tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-terminal \
            dbus-x11 \
            tigervnc-standalone-server \
            tigervnc-tools \
            tigervnc-common \
            novnc \
            websockify \
            openssh-server \
            curl \
            wget \
            openssl \
            tmate

      - name: Install Cloudflared Tunnel
        run: |
          curl -fsSL --retry 3 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          rm -f cloudflared.deb

      - name: Configure Multi-User Desktop & Auto-Generate Password
        id: setup_desktop
        run: |
          # 1. Generate 10-character alphanumeric password
          AUTO_PASS=$(openssl rand -base64 12 | tr -dc 'a-zA-Z0-9' | head -c 10)

          # 2. Sync password with 'runner' system account
          echo "runner:$AUTO_PASS" | sudo chpasswd

          # 3. Configure VNC password
          mkdir -p ~/.vnc
          echo "$AUTO_PASS" | vncpasswd -f > ~/.vnc/passwd 2>/dev/null || printf "$AUTO_PASS\n$AUTO_PASS\nn\n" | vncpasswd
          chmod 600 ~/.vnc/passwd

          # 4. Strict TigerVNC multi-session config file
          cat << 'EOF' > ~/.vnc/config
          session=xfce
          geometry=1366x768
          depth=24
          SecurityTypes=VncAuth
          AlwaysShared=1
          NeverShared=0
          EOF

          # 5. Session startup script with DBus support
          cat << 'EOF' > ~/.vnc/xstartup
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          [ -x /etc/vnc/xstartup ] && exec /etc/vnc/xstartup
          [ -r $HOME/.Xresources ] && xrdb $HOME/.Xresources
          exec dbus-launch --exit-with-session startxfce4
          EOF
          chmod +x ~/.vnc/xstartup

          # 6. Clean any existing locks and launch VNC on display :1
          sudo rm -f /tmp/.X1-lock /tmp/.X11-unix/X1 || true
          VNC_CMD=$(command -v vncserver || command -v tigervncserver)
          $VNC_CMD :1

          # 7. Start HTML5 websockify bridge (WITHOUT --heartbeat so Cloudflare proxy doesn't drop it)
          websockify --web /usr/share/novnc 6080 localhost:5901 &

          echo "PASS=$AUTO_PASS" >> "$GITHUB_OUTPUT"

      - name: Start Cloudflare Tunnel (Web GUI)
        id: tunnel
        run: |
          cloudflared tunnel --url http://localhost:6080 --logfile cloudflared.log &

          echo "Waiting for Cloudflare Tunnel to initialize..."
          TUNNEL_URL=""

          for i in {1..40}; do
            if [ -f cloudflared.log ]; then
              TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' cloudflared.log | head -n 1)
              if [ -n "$TUNNEL_URL" ]; then
                echo "Tunnel established in ${i} seconds."
                break
              fi
            fi
            sleep 1
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "ERROR: Cloudflare tunnel allocation failed. Log output:"
            cat cloudflared.log
            exit 1
          fi

          echo "URL=$TUNNEL_URL" >> "$GITHUB_OUTPUT"

      - name: Start Native OpenSSH Server & Tunnels
        id: ssh_setup
        run: |
          # Configure OpenSSH server
          sudo systemctl enable --now ssh
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh

          # Pre-generate RSA & Ed25519 keys
          mkdir -p ~/.ssh
          [ -f ~/.ssh/id_rsa ] || ssh-keygen -t rsa -b 2048 -f ~/.ssh/id_rsa -N "" -q
          [ -f ~/.ssh/id_ed25519 ] || ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N "" -q

          # Start Pinggy TCP tunnel for OpenSSH
          ssh -p 443 -R0:localhost:22 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 tcp@a.pinggy.io > pinggy.log 2>&1 &

          # Start tmate
          tmate -S /tmp/tmate.sock new-session -d -s main
          tmate -S /tmp/tmate.sock set-option -g mouse on

          echo "Waiting for SSH tunnel..."
          NATIVE_SSH=""
          for i in {1..25}; do
            if [ -f pinggy.log ]; then
              TCP_ADDR=$(grep -oE 'tcp://[a-zA-Z0-9.-]+:[0-9]+' pinggy.log | head -n 1 | sed 's|tcp://||')
              if [ -n "$TCP_ADDR" ]; then
                PORT=$(echo "$TCP_ADDR" | cut -d: -f2)
                HOST=$(echo "$TCP_ADDR" | cut -d: -f1)
                NATIVE_SSH="ssh -p $PORT runner@$HOST"
                break
              fi
            fi
            sleep 1
          done

          TMATE_SSH=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' 2>/dev/null || true)
          TMATE_WEB=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}' 2>/dev/null || true)

          FINAL_SSH="${NATIVE_SSH:-$TMATE_SSH}"
          [ -z "$FINAL_SSH" ] && FINAL_SSH="Unavailable"
          [ -z "$TMATE_WEB" ] && TMATE_WEB="Available via Terminal inside Web Desktop"

          echo "SSH_CMD=$FINAL_SSH" >> "$GITHUB_OUTPUT"
          echo "WEB_SHELL=$TMATE_WEB" >> "$GITHUB_OUTPUT"

      - name: Publish Connection Summary
        run: |
          AUTO_PASS="${{ steps.setup_desktop.outputs.PASS }}"
          TUNNEL_URL="${{ steps.tunnel.outputs.URL }}"
          AUTOLOGIN_LINK="${TUNNEL_URL}/vnc.html?autoconnect=true&resize=remote&password=${AUTO_PASS}"
          SSH_CMD="${{ steps.ssh_setup.outputs.SSH_CMD }}"
          WEB_SHELL="${{ steps.ssh_setup.outputs.WEB_SHELL }}"

          echo "================================================================================"
          echo "  ONE-CLICK DESKTOP: $AUTOLOGIN_LINK"
          echo "  MANUAL WEB URL:   $TUNNEL_URL/vnc.html"
          echo "  PASSWORD:         $AUTO_PASS"
          echo "  SSH COMMAND:      $SSH_CMD"
          echo "================================================================================"

          echo "## 🚀 Remote Ubuntu Runner Online" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🖥️ Web GUI Desktop (Multi-Client Enabled)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔗 **1-Click Auto-Login**: [Open Web Desktop](${AUTOLOGIN_LINK})" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 **Manual Link**: \`${TUNNEL_URL}/vnc.html\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🔑 **Password**: \`${AUTO_PASS}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💻 Full Root SSH Access" >> $GITHUB_STEP_SUMMARY
          echo "- ⚡ **Native SSH Command**: \`$SSH_CMD\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🔑 **SSH Password**: \`${AUTO_PASS}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🛡️ **Root Access**: Run \`sudo -i\` after connecting" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 **Browser Shell**: [Open Web Terminal](${WEB_SHELL})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Session active for up to 6 hours.*" >> $GITHUB_STEP_SUMMARY

      - name: Keep-Alive Loop
        run: |
          echo "Runner active. Listening for connections..."
          for i in {1..350}; do
            echo "Heartbeat: minute $i of 350 active..."
            sleep 60
          done
