name: Legal Glory test box

on:
  workflow_dispatch: {}        # you start it manually when you want me online

jobs:
  box:
    runs-on: ubuntu-latest     # public repo max: 4 vCPU / 16 GB RAM / KVM enabled
    timeout-minutes: 350       # public repos cap jobs at 6 h
    steps:
      - name: Maximize free disk (to ~50-60 GB)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Join tailnet (fixed name + IP)
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: legalglory-runner

      - name: Report identity
        run: |
          echo "tailnet IP: $(tailscale ip -4)"
          echo "kvm: $(ls -la /dev/kvm 2>/dev/null || echo missing)"
          df -h / | tail -1

      - name: SSH door for the agent (key-only)
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ vars.AGENT_SSH_PUBKEY }}" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo systemctl enable --now ssh

      - name: Desktop + RDP + noVNC
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-terminal xrdp tigervnc-standalone-server \
            novnc websockify dbus-x11 adb
          echo 'runner:${{ secrets.RUNNER_PASSWORD }}' | sudo chpasswd
          sudo adduser xrdp ssl-cert
          echo "startxfce4" > ~/.xsession
          sudo systemctl enable --now xrdp
          # noVNC (browser desktop) on :6080, VNC display :1
          vncpasswd -f <<< '${{ secrets.RUNNER_PASSWORD }}' > ~/.vncpasswd
          mkdir -p ~/.vnc
          cp ~/.vncpasswd ~/.vnc/passwd && chmod 600 ~/.vnc/passwd
          vncserver :1 -geometry 1600x900 -localhost yes
          websockify --web=/usr/share/novnc 6080 localhost:5901 &

      - name: Android SDK (API 36 + emulator image)
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -4 -sSLo /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/ct.zip -d /tmp/ct
          mv /tmp/ct/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses >/dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "emulator" "system-images;android-30;google_apis;x86_64" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> ~/.bashrc

      - name: Stay online
        run: |
          echo "BOX READY — tailnet: legalglory-runner ($(tailscale ip -4))"
          echo "  ssh   : runner@<tailnet-ip>   (agent key)"
          echo "  rdp   : <tailnet-ip>:3389     (runner / RUNNER_PASSWORD)"
          echo "  novnc : http://<tailnet-ip>:6080/vnc.html"
          sleep 12600                   # hold the box ~3.5 h, then clean exit
