name: 🚀 Legal Glory 6H RDP • Direct SSH • Multi-Client Parallel

on:
  workflow_dispatch:
    inputs:
      session_duration_hours:
        description: 'Session duration (hours, 1-6 max)'
        required: false
        default: '6'
        type: string
      max_parallel_clients:
        description: 'Max simultaneous SSH connections'
        required: false
        default: '10'
        type: string
      enable_rdp:
        description: 'Enable RDP GUI desktop'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      enable_vnc:
        description: 'Enable VNC + noVNC browser'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      android_api_level:
        description: 'Android emulator API level'
        required: false
        default: '36'
        type: choice
        options:
          - '30'
          - '33'
          - '34'
          - '35'
          - '36'

jobs:
  legal-glory-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    
    steps:
      - name: ✅ Validate inputs & setup environment
        run: |
          set -e
          HOURS="${{ github.event.inputs.session_duration_hours || 6 }}"
          if ! [[ "$HOURS" =~ ^[0-9]+$ ]] || (( HOURS < 1 || HOURS > 6 )); then
            echo "❌ Duration must be 1-6 hours"
            exit 1
          fi
          MINUTES=$((HOURS * 60))
          SECONDS=$((MINUTES * 60))
          CLIENTS="${{ github.event.inputs.max_parallel_clients || 10 }}"
          echo "SESSION_HOURS=$HOURS" >> $GITHUB_ENV
          echo "SESSION_SECONDS=$SECONDS" >> $GITHUB_ENV
          echo "MAX_CLIENTS=$CLIENTS" >> $GITHUB_ENV
          echo "ANDROID_API=${{ github.event.inputs.android_api_level || 36 }}" >> $GITHUB_ENV
          echo "ENABLE_RDP=${{ github.event.inputs.enable_rdp || true }}" >> $GITHUB_ENV
          echo "ENABLE_VNC=${{ github.event.inputs.enable_vnc || true }}" >> $GITHUB_ENV
          echo "✅ Validated"

      - name: 📦 Maximize disk
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: 🚀 Performance tuning
        run: |
          set -e
          sudo tee /etc/security/limits.d/99-legalglory.conf > /dev/null <<'LIMITS'
          * soft nofile 65535
          * hard nofile 65535
          * soft nproc 65535
          * hard nproc 65535
          LIMITS
          sudo sysctl -w net.core.somaxconn=65535 > /dev/null 2>&1 || true
          sudo sysctl -w net.ipv4.tcp_max_syn_backlog=65535 > /dev/null 2>&1 || true
          echo "✅ Performance tuning done"

      - name: 🔐 Generate SSH keypair
        run: |
          set -e
          mkdir -p ~/.ssh /tmp/ssh-session
          ssh-keygen -t ed25519 -f ~/.ssh/session_key -N "" -C "legalglory" > /dev/null 2>&1
          cp ~/.ssh/session_key /tmp/ssh-session/private_key
          chmod 600 /tmp/ssh-session/private_key
          cat ~/.ssh/session_key.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          RDP_PASSWORD=$(openssl rand -base64 16 | tr -d "=+/" | cut -c1-16)
          echo "$RDP_PASSWORD" > /tmp/ssh-session/rdp_password.txt
          chmod 600 /tmp/ssh-session/rdp_password.txt
          echo "RDP_PASSWORD=$RDP_PASSWORD" >> $GITHUB_ENV
          echo "✅ SSH keypair generated"

      - name: 🔓 Configure SSH server
        run: |
          set -e
          MAX_CLIENTS=${{ env.MAX_CLIENTS }}
          
          # Backup original config
          sudo cp /etc/ssh/sshd_config /etc/ssh/sshd_config.bak
          
          # Create new clean config by appending
          sudo tee -a /etc/ssh/sshd_config > /dev/null <<EOF
          
          # LEGAL GLORY CONFIG
          Port 22
          AddressFamily any
          ListenAddress 0.0.0.0
          ListenAddress ::
          PermitRootLogin no
          PubkeyAuthentication yes
          PasswordAuthentication no
          MaxAuthTries 5
          MaxStartups 100:30:${MAX_CLIENTS}
          MaxSessions ${MAX_CLIENTS}
          MaxSessionsPerUser ${MAX_CLIENTS}
          TCPKeepAlive yes
          ClientAliveInterval 30
          ClientAliveCountMax 720
          AllowTcpForwarding yes
          AllowAgentForwarding yes
          X11Forwarding yes
          Compression yes
          EOF
          
          # Test config
          echo "Testing SSH config..."
          SSHD_TEST=$(sudo sshd -t 2>&1)
          if [ $? -ne 0 ]; then
            echo "SSH config error: $SSHD_TEST"
            echo "Restoring backup..."
            sudo cp /etc/ssh/sshd_config.bak /etc/ssh/sshd_config
            exit 1
          fi
          
          echo "✅ SSH config valid"
          sudo systemctl restart ssh
          sleep 1
          
          if sudo systemctl is-active --quiet ssh; then
            echo "✅ SSH running"
          else
            echo "❌ SSH failed"
            sudo systemctl status ssh
            exit 1
          fi

      - name: 🖥️ Install RDP
        if: ${{ env.ENABLE_RDP == 'true' }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-terminal xrdp dbus-x11 mesa-utils 2>&1 | tail -2
          echo "runner:${{ env.RDP_PASSWORD }}" | sudo chpasswd
          echo "startxfce4" > ~/.xsession
          sudo usermod -aG ssl-cert,audio,video runner 2>/dev/null || true
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp
          sleep 2
          
          if sudo systemctl is-active --quiet xrdp; then
            echo "✅ RDP running"
          else
            echo "⚠️ RDP starting (may take a moment)"
          fi

      - name: 📺 Install VNC
        if: ${{ env.ENABLE_VNC == 'true' }}
        run: |
          set -e
          sudo apt-get install -y tigervnc-standalone-server novnc websockify 2>&1 | tail -1
          mkdir -p ~/.vnc
          vncpasswd -f <<< "${{ env.RDP_PASSWORD }}" > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          vncserver :1 -geometry 1920x1080 -depth 24 2>&1 | head -3 || true
          sleep 2
          nohup websockify 6080 localhost:5901 > /tmp/websockify.log 2>&1 &
          echo "✅ VNC ready"

      - name: 🤖 Install Android SDK
        run: |
          set -e
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          mkdir -p $ANDROID_HOME/cmdline-tools ~/.android
          
          curl -4 -sSL --connect-timeout 20 --retry 3 -o /tmp/android.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" 2>&1 | tail -1
          unzip -q /tmp/android.zip -d /tmp/android-ct
          mv /tmp/android-ct/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          
          yes 2>/dev/null | sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null 2>&1 || true
          
          echo "Installing packages..."
          for PKG in "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-36;google_apis;x86_64"; do
            sdkmanager --sdk_root=$ANDROID_HOME "$PKG" 2>&1 | tail -1 || true
          done
          
          echo "export ANDROID_HOME=$ANDROID_HOME" >> ~/.bashrc
          echo "export PATH=\$ANDROID_HOME/platform-tools:\$PATH" >> ~/.bashrc
          echo "✅ Android SDK ready"

      - name: ⏱️ Keep session alive
        run: |
          SESSION_SECONDS=${{ env.SESSION_SECONDS }}
          SESSION_HOURS=${{ env.SESSION_HOURS }}
          
          echo ""
          echo "╔═══════════════════════════════════════════════════════╗"
          echo "║  🎉 LEGAL GLORY SESSION ACTIVE - $SESSION_HOURS HOURS  🎉  ║"
          echo "║  ✅ SSH: 22 (direct)   RDP: 3389   VNC: 5901+6080   ║"
          echo "║  🔐 No VPN • No Tailscale • No Proxy                 ║"
          echo "║  📡 No drops (720 x 30sec keep-alive)                ║"
          echo "╚═══════════════════════════════════════════════════════╝"
          echo ""
          
          START=$(date +%s)
          END=$((START + SESSION_SECONDS))
          
          while [ $(date +%s) -lt $END ]; do
            ELAPSED=$(($(date +%s) - START))
            REMAIN=$((SESSION_SECONDS - ELAPSED))
            HOURS=$((REMAIN / 3600))
            MINS=$(((REMAIN % 3600) / 60))
            
            if [ $((ELAPSED % 300)) -lt 10 ]; then
              echo "✅ $(date '+%H:%M:%S') - Remaining: ${HOURS}h ${MINS}m"
            fi
            
            sudo systemctl is-active --quiet ssh || sudo systemctl restart ssh
            if [ "${{ env.ENABLE_RDP }}" = "true" ]; then
              sudo systemctl is-active --quiet xrdp || sudo systemctl restart xrdp
            fi
            
            sleep 10
          done
          
          echo "⏳ Session completed"

      - name: 📋 Show credentials
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════════════"
          echo "PRIVATE KEY:"
          echo "════════════════════════════════════════════"
          cat /tmp/ssh-session/private_key
          echo ""
          echo "════════════════════════════════════════════"
          echo "RDP/VNC PASSWORD:"
          echo "════════════════════════════════════════════"
          cat /tmp/ssh-session/rdp_password.txt
          echo ""
          echo "════════════════════════════════════════════"
          echo "SSH USAGE:"
          echo "════════════════════════════════════════════"
          echo "ssh -i private_key runner@PUBLIC_IP"
          echo "ssh -i private_key -N -L 3389:localhost:3389 runner@PUBLIC_IP"
          echo ""

      - name: 🧹 Cleanup
        if: always()
        run: |
          shred -vfz -n 10 /tmp/ssh-session/* 2>/dev/null || rm -f /tmp/ssh-session/*
          rm -rf /tmp/ssh-session
          echo "✅ Cleaned"
