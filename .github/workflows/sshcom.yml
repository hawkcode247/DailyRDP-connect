name: Legal Glory Dev Box (6h)

on:
  workflow_dispatch:

concurrency:
  group: devbox
  cancel-in-progress: false

jobs:
  devbox:
    runs-on: ubuntu-latest        # KVM + Android SDK preinstalled
    timeout-minutes: 355          # ~6h, under the 360 hard cap
    steps:
      - name: Show runner specs
        run: |
          echo "vCPU: $(nproc)  RAM: $(free -g | sed -n 2p)"
          ls -la /dev/kvm || echo "NO KVM - emulator will be slow!"
          echo "ANDROID_HOME=$ANDROID_HOME"
          df -h /

      - name: Join Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          version: latest

      - name: Open firewall for tailnet traffic (SSH + RDP)
        run: |
          sudo ufw allow 22 || true
          sudo ufw allow 3389 || true
          sudo ufw --force enable || true
          sudo systemctl start ssh
          sudo systemctl enable ssh

      - name: Announce identity
        run: |
          echo "TAILSCALE IP:"
          tailscale ip -4
          echo "Runner user: $(whoami)"
          echo "SSH READY - sandbox can connect now"

      - name: Prepare desktop + RDP (for GUI viewing)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xrdp xfce4 xfce4-terminal dbus-x11 >/dev/null
          sudo adduser runner ssl-cert || true
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp
          echo "RDP up on 3389 (user: runner)"

      - name: Keep box alive ~6 hours
        run: |
          while true; do
            echo "keepalive $(date) - uptime ok, tmux-free box"
            sleep 60
          done
