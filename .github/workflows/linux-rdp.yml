name: Ubuntu Web Desktop (Auto-Pass & 1-Click)

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free Maximum Storage
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: Install Desktop & VNC Tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-terminal \
            tigervnc-standalone-server tigervnc-common \
            novnc websockify curl wget openssl

      - name: Setup Cloudflare Quick Tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          rm -f cloudflared-linux-amd64.deb

      - name: Generate Random Password & Start VNC
        id: vnc_setup
        run: |
          # Automatically generate a 10-character alphanumeric password
          AUTO_PASS=$(openssl rand -base64 12 | tr -dc 'a-zA-Z0-9' | head -c 10)
          
          # Set VNC password
          mkdir -p ~/.vnc
          echo "$AUTO_PASS" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

          # Configure XFCE startup
          cat << 'EOF' > ~/.vnc/xstartup
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec startxfce4
          EOF
          chmod +x ~/.vnc/xstartup

          # Start TigerVNC & noVNC
          vncserver :1 -geometry 1366x768 -depth 24
          websockify --web /usr/share/novnc 6080 localhost:5901 &

          # Mask password in logs and save as output
          echo "::add-mask::$AUTO_PASS"
          echo "PASS=$AUTO_PASS" >> "$GITHUB_OUTPUT"

      - name: Launch Tunnel & Publish Access Link
        run: |
          # Start tunnel
          cloudflared tunnel --url http://localhost:6080 > cloudflared.log 2>&1 &
          sleep 6

          TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' cloudflared.log | head -n 1)
          AUTO_PASS="${{ steps.vnc_setup.outputs.PASS }}"
          AUTOLOGIN_LINK="$TUNNEL_URL/vnc.html?autoconnect=true&password=$AUTO_PASS"

          # Print to the job run summary tab (renders formatted markdown in GitHub UI)
          echo "### 🚀 Ubuntu Desktop is Online" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **One-Click Auto-Login**: [Open Web Desktop]($AUTOLOGIN_LINK)" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct URL**: \`$TUNNEL_URL/vnc.html\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Password**: \`$AUTO_PASS\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Max Runtime**: Up to 6 hours" >> $GITHUB_STEP_SUMMARY

      - name: Keep-Alive Loop
        run: |
          for i in {1..350}; do
            sleep 60
          done
