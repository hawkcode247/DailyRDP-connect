      - name: Generate Random Password & Start VNC
        id: vnc_setup
        run: |
          # Generate 10-character password (without GitHub masking so you can read it)
          AUTO_PASS=$(openssl rand -base64 12 | tr -dc 'a-zA-Z0-9' | head -c 10)
          
          mkdir -p ~/.vnc
          echo "$AUTO_PASS" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

          cat << 'EOF' > ~/.vnc/xstartup
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec startxfce4
          EOF
          chmod +x ~/.vnc/xstartup

          # Start TigerVNC & noVNC
          vncserver :1 -geometry 1366x768 -depth 24
          websockify --web /usr/share/novnc 6080 localhost:5901 &

          echo "PASS=$AUTO_PASS" >> "$GITHUB_OUTPUT"

      - name: Launch Tunnel & Print Link
        run: |
          # Start cloudflared using its built-in --logfile flag
          cloudflared tunnel --url http://localhost:6080 --logfile cloudflared.log &

          echo "Waiting for Cloudflare Tunnel to allocate URL..."
          TUNNEL_URL=""
          
          # Poll every second for up to 35 seconds
          for i in {1..35}; do
            if [ -f cloudflared.log ]; then
              TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' cloudflared.log | head -n 1)
              if [ -n "$TUNNEL_URL" ]; then
                echo "Tunnel established after ${i}s!"
                break
              fi
            fi
            sleep 1
          done

          # If the tunnel failed to allocate within 35s, dump the log to show the exact error
          if [ -z "$TUNNEL_URL" ]; then
            echo "ERROR: Cloudflare tunnel timed out. Log output:"
            cat cloudflared.log
            exit 1
          fi

          AUTO_PASS="${{ steps.vnc_setup.outputs.PASS }}"
          AUTOLOGIN_LINK="${TUNNEL_URL}/vnc.html?autoconnect=true&password=${AUTO_PASS}"

          # 1. Print directly into GitHub console logs
          echo "================================================================================"
          echo "  ONE-CLICK DESKTOP: $AUTOLOGIN_LINK"
          echo "  WEB URL:          $TUNNEL_URL/vnc.html"
          echo "  PASSWORD:         $AUTO_PASS"
          echo "================================================================================"

          # 2. Render as clickable markdown on the GitHub Actions Summary tab
          echo "### 🚀 Ubuntu Desktop Online" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **One-Click Auto-Login**: [Open Web Desktop](${AUTOLOGIN_LINK})" >> $GITHUB_STEP_SUMMARY
          echo "- **Manual URL**: \`${TUNNEL_URL}/vnc.html\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Password**: \`${AUTO_PASS}\`" >> $GITHUB_STEP_SUMMARY
